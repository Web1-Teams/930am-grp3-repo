<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-wrapper">

        <!-- Main Content -->
        <main class="main">
            <div class="content-wrapper">
                <!-- Pet Image -->
                <div class="pet-image-container">
                    <img src="cat3.jpg" alt="Adorable Cat" class="pet-image">
                </div>

                <!-- Pet Details and Adoption Form -->
                <div class="pet-info">
                    <h2 class="pet-name">Mittens</h2>
                    <p><strong>Age:</strong> 2 years</p>
                    <p><strong>Type:</strong> Cat</p>
                    <p><strong>Location:</strong> Nablus, Palestine</p>
                    <p class="pet-description">
                        Mittens is a friendly and playful cat who loves cuddles and attention. She’s healthy, vaccinated, and ready for her forever home!
                    </p>
                    <h3>Adopt Mittens</h3>
                    <form class ="email-form">
                        <label for="email">Enter your email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                        <button type="submit" class="adopt-button">Adopt Me!</button>
                    </form>
                </div>
            </div>
        </main>

        
    </div>
</body>
</html>
